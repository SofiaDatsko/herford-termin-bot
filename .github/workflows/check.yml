name: Herford Termin Check

on:
  schedule:
    # Мінімальний інтервал GitHub Actions - 5 хвилин. Сам скрипт всередині
    # кожного запуску робить кілька перевірок кожну ~хвилину протягом ~4.5 хв,
    # тож ефективно перевірка відбувається набагато частіше за 5 хв.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Не даємо новому запуску стартувати, поки попередній ще не завершився
# (про всяк випадок, якщо перевірка раптом затягнеться довше 5 хв).
concurrency:
  group: herford-termin-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browser (only if not cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (fast, even on cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run check loop (~4.5 min, checks roughly every minute)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python herford_termin_bot.py

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 3
