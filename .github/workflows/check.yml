name: Herford Termin Check

on:
  schedule:
    # Запасний тригер (раз на 20 хв) на випадок, якщо зовнішній cron
    # (cron-job.org) раптом не спрацює. Основний ритм (щохвилини) задає
    # cron-job.org через workflow_dispatch - див. README.md.
    - cron: "*/20 * * * *"
    # Щогодинний запуск, який додатково шле в Telegram статус бота
    # ("живий, слотів немає" або "перевірка не вдалася: ...").
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "Надіслати статус у Telegram (для ручного тесту)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browser (only if not cached)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (fast, even on cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_STATUS: ${{ github.event.schedule == '10 * * * *' || inputs.notify == true }}
        run: python herford_termin_bot.py --once

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 3
