name: Herford Termin Check

on:
  schedule:
    # Запуск кожні 10 хвилин. GitHub може затримувати виконання під
    # навантаженням, тому реальний інтервал іноді буде 10-20 хв.
    - cron: "*/10 * * * *"
  # Дозволяє запустити вручну кнопкою "Run workflow" на вкладці Actions,
  # зручно для першого тесту.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python herford_termin_bot.py --once

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug/
          retention-days: 3
